name: CI

# Pull requests run the checks. Pushes to main only publish the image.
# A pull request must pass before merge, so main does not run the tests again.
on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

# Cancel an old run when you push a new commit to the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dearest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dearest"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # Read the Rust version and components from rust-toolchain.toml.
      # This action also caches dependencies.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  docker:
    name: Docker build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish image and deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger Dokploy deploy
        run: curl -fsS -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
      # Frontend builds read the spec from the deployed API. Check that the API
      # sends a usable spec. Dokploy deploys after the webhook, so try for 5 minutes.
      # The check can pass on the old container before the new container starts.
      - name: Check the deployed spec
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS https://api.dearest.rsvp/openapi.json | jq -e '.openapi and (.paths | length > 0)' >/dev/null; then
              echo "The deployed API sends a usable spec."
              exit 0
            fi
            echo "Attempt $attempt failed. Wait 10 seconds."
            sleep 10
          done
          echo "The deployed API does not send a usable spec." >&2
          exit 1
