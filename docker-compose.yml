services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dearest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dearest"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Local email server. The API sends email here. Open http://localhost:8025 to read it.
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/dearest
      BIND_ADDR: 0.0.0.0:3000
      RUST_LOG: info,tower_http=debug
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_TLS: "false"
      APP_BASE_URL: http://localhost:5173
      COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  pgdata:
